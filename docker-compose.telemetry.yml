# Telemetry backends for local development.
#
#   MISSION_CONTROL_OTLP_ENDPOINT=http://host.docker.internal:8090 \
#   MISSION_CONTROL_INGEST_KEY=mcik_... \
#     docker compose -f docker-compose.telemetry.yml up -d
#
# Then point the application at the collector and nothing else:
#
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 npm run api
#
# Grafana: http://localhost:3300  (anonymous admin — demo only)
#
# Grafana and Tempo rather than Jaeger. Jaeger is a fine trace viewer, but it is
# only a trace viewer: an enterprise audience asks where the logs and metrics go
# and the answer is "a different tool". Tempo is Grafana's trace store, sitting
# beside Loki for logs and Prometheus or Mimir for metrics, all queried through
# one Grafana. Adding those later needs no change to the application — only
# another exporter in the collector.
#
# Tempo also derives RED metrics (rate, errors, duration) and a service graph
# from the spans themselves, so the application gets dashboards without emitting
# a single metric of its own.
#
# None of this is required to run Fieldlines. With no collector reachable the app
# exports nothing and works normally — telemetry is never load-bearing.

services:
  tempo:
    image: grafana/tempo:2.6.1
    container_name: fieldlines-tempo
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # Restart on its own so a laptop sleeping, or Docker restarting, does not
    # quietly take the demo down.
    restart: unless-stopped
    networks: [telemetry]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: fieldlines-grafana
    environment:
      # Anonymous admin: this is a local demo, and a login prompt in the middle
      # of a walkthrough is friction with no security value here.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./otel/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./otel/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3300:3000'
    depends_on: [tempo]
    restart: unless-stopped
    networks: [telemetry]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: fieldlines-otel-collector
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/config.yaml:ro
    environment:
      # Where Mission Control listens. From inside a container, the host is
      # reachable as host.docker.internal — localhost would be the container.
      MISSION_CONTROL_OTLP_ENDPOINT: ${MISSION_CONTROL_OTLP_ENDPOINT:-http://host.docker.internal:8090}
      MISSION_CONTROL_INGEST_KEY: ${MISSION_CONTROL_INGEST_KEY:-}
    ports:
      - '4317:4317'   # OTLP over gRPC
      - '4318:4318'   # OTLP over HTTP
    depends_on: [tempo]
    extra_hosts:
      # Linux does not provide host.docker.internal by default.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    networks: [telemetry]

volumes:
  tempo-data:
  grafana-data:

networks:
  telemetry:
    driver: bridge
