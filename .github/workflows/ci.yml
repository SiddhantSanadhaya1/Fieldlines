name: CI

# Runs the tests and the build on every push and pull request, then deploys to
# Vercel from main.
#
# This workflow is also the trigger for Mission Control's self-healing loop: when
# a job here fails, the `workflow_run` webhook delivers the failure, Mission
# Control fetches these logs, sifts them down to the error, and raises a fix
# story. So the useful property is not just that it fails, but that it fails
# *legibly* — one obvious error line, not a wall of noise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref. Without this, two
  # runs can fail for the same commit and produce two incidents for one problem.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the contract, and a
      # silently-resolved different version is the kind of failure that wastes a
      # healing cycle on a problem that is not in the code.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # tsc --noEmit followed by the Vite bundle. Covers src/ and api/ — the API
      # handlers were outside the compiler's view until tsconfig included them.
      - name: Build
        run: npm run build

      # No artifact upload. Nothing downstream consumes it — Vercel builds from
      # source itself — and the organisation's artifact storage quota is shared,
      # so uploading a bundle nobody reads turns a green build red once the quota
      # fills. A failing CI job here also raises a self-healing incident, so a
      # storage limit would become a request to fix code that is not broken.

  deploy:
    name: Deploy to Vercel
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Deploying needs three secrets. Rather than fail the run when they are
      # absent — which would raise a self-healing incident for a configuration
      # gap that no code change can fix — the step reports what is missing and
      # the job ends green.
      - name: Check Vercel configuration
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets are not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.config.outputs.ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
