name: CI

# Runs the tests and the build on every push and pull request.
#
# It deliberately does NOT deploy. Vercel's own Git integration ships the app,
# and duplicating that here would mean every push deploys twice and would need
# three Vercel secrets on this repository for no benefit.
#
# What this workflow is actually for is being the thing that can go red. A failed
# job here is one of Mission Control's two intakes: the `workflow_run` webhook
# delivers the failure, Mission Control fetches these logs, sifts them to the
# error, and raises a fix story with a pull request. The other intake is a
# runtime exception arriving over OTLP.
#
# So the useful property is not only that it fails, but that it fails *legibly* —
# one obvious error line rather than a wall of noise, because those logs are read
# by a model that has to locate the file and line from them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref. Without this, two
  # runs can fail for the same commit and produce two incidents for one problem.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the contract, and a
      # silently-resolved different version is the kind of failure that wastes a
      # healing cycle on a problem that is not in the code.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # tsc --noEmit followed by the Vite bundle. Covers src/ and api/ — the API
      # handlers were outside the compiler's view until tsconfig included them.
      - name: Build
        run: npm run build

      # No artifact upload. Nothing downstream consumes it — Vercel builds from
      # source itself — and the organisation's artifact storage quota is shared,
      # so uploading a bundle nobody reads turns a green build red once the quota
      # fills. A failing CI job here also raises a self-healing incident, so a
      # storage limit would become a request to fix code that is not broken.
