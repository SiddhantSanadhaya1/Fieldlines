# Grafana Tempo — the trace store behind the Grafana UI.
#
# Tempo is to traces what Loki is to logs and Prometheus is to metrics: the
# storage layer, queried through Grafana rather than through a UI of its own.
# That is the reason to prefer it over Jaeger here — traces, logs and metrics end
# up in one pane rather than three separate tools.
#
# It speaks OTLP natively, so the collector needs no translation and the
# application needs no change whatsoever.

server:
  http_listen_port: 3200
  # Quieter than the default; this is a demo, not a production cluster.
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush quickly. The default holds traces in memory for minutes, which in a
  # demo reads as "the trace never arrived".
  max_block_duration: 5m
  complete_block_timeout: 10s

compactor:
  compaction:
    # Local disk, small retention. Nothing here needs to outlive the demo.
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Turns spans into RED metrics (rate, errors, duration) without the application
# emitting any metrics itself — which is the single most persuasive thing to show
# an enterprise audience about adopting OpenTelemetry.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  metrics_generator_processors:
    - service-graphs
    - span-metrics
