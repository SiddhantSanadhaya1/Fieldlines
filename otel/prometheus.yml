# Prometheus — the metric store behind the Grafana dashboards.
#
# It scrapes two things: the OpenTelemetry Collector, which republishes the
# metrics Fieldlines sends it, and Tempo's metrics generator, which derives rate,
# error and duration series from the spans themselves.
#
# Remote write is enabled so Tempo can push; scraping covers the rest.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
